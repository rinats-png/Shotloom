[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shotloom"
version = "0.1.0"
description = "Agentic, provider-neutral film production workflow with continuity, generation handoffs and QA gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5"]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
shotloom = "shotloom.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shotloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
